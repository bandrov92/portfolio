<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff" id="metaTheme">
<title>Bandarov — الشهادات التدريبية</title>
<meta name="description" content="الشهادات التدريبية لبندر عايض الأسمري.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600&family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body class="inner">

<header class="topbar">
  <a class="brand" href="index.html#home"><img src="assets/images/logo.webp" alt="Bandarov logo"><b>BANDAROV</b></a>
  <nav class="site-nav" aria-label="Main">
    <a class="ctrl" href="index.html#home" data-i18n="nav_home">الرئيسية</a>
    <a class="ctrl" href="index.html#projects" data-i18n="nav_projects">المشاريع</a>
    <a class="ctrl is-active" href="certificates.html" aria-current="page" data-i18n="nav_credentials">الشهادات</a>
    <a class="ctrl" href="licenses.html" data-i18n="nav_licenses">الرخص</a>
    <a class="ctrl" href="badges.html" data-i18n="nav_badges">الشارات</a>
    <a class="ctrl" href="index.html#contact" data-i18n="nav_contact">تواصل</a>
  </nav>
  <div class="controls">
    <button class="ctrl" id="langBtn" aria-label="Switch language">EN</button>
    <button class="ctrl" id="themeBtn" aria-label="Toggle theme"><span id="themeIco">◐</span><span data-i18n="theme"></span></button>
  </div>
</header>

<section class="hero hero-page" id="hero">
  <div class="hero-mesh"></div>
  <span class="eyebrow" data-i18n="s_certs">الشهادات</span>
  <h1 class="display" data-i18n="certs_hub_t">مركز الشهادات المهنية</h1>
  <p class="lead" data-i18n="certs_hub_p">جميع الشهادات المهنية المختارة في مكان واحد.</p>
</section>

<section class="reveal in" id="certGrid">
  <div class="grid g3" id="certCards"></div>
</section>

<footer><span data-i18n="footer">© 2026 بندر عايض الأسمري — Bandarov. جميع الحقوق محفوظة.</span></footer>

<script src="main.js" defer></script>
<script defer>
window.addEventListener("DOMContentLoaded", async ()=>{
  let certs = [];
  try{
    const res = await fetch("data/certificates.json", { cache: "no-store" });
    const data = await res.json();
    certs = data.certificates || [];
  }catch(e){
    certs = [];
  }

  function render(){
    const isAr = document.documentElement.lang === "ar";
    const d = I18N[isAr?"ar":"en"];
    const labels = isAr ? {
      issued: "تاريخ الإصدار",
      period: "مدة البرنامج",
      number: "رقم الشهادة",
      tracks: "محاور الزمالة الرئيسية",
      related: "مسارات Vanderbilt عبر Coursera",
      pending: "قيد الإصدار",
      pendingNote: "(في مراحل الاعتماد النهائية)"
    } : {
      issued: "Issued",
      period: "Program period",
      number: "Certificate number",
      tracks: "Fellowship core tracks",
      related: "Vanderbilt courses via Coursera",
      pending: "Pending issuance",
      pendingNote: "(In final accreditation stages)"
    };
    document.title = "Bandarov — " + d.certs_hub_t;
    const wrap = document.getElementById("certCards");
    wrap.innerHTML = "";
    certs.forEach(c=>{
      const card = document.createElement("article");
      card.className = "card cert-card";
      const tracks = c[isAr ? "tracks_ar" : "tracks_en"] || c.tracks_ar || c.tracks_en || [];
      const related = c[isAr ? "related_credentials_ar" : "related_credentials_en"] || c.related_credentials_ar || c.related_credentials_en || [];
      if(tracks.length || related.length || c.image || c.pending) card.classList.add("is-featured");
      const media = document.createElement("div");
      media.className = "cert-media";
      if(c.image){
        const img = document.createElement("img");
        img.src = c.image;
        img.alt = isAr ? c.title_ar : c.title_en;
        media.appendChild(img);
      }else if(c.pending){
        const ph = document.createElement("div");
        ph.className = "cert-placeholder cert-placeholder-pending";
        const icon = document.createElement("span");
        icon.className = "cert-pending-icon";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = "⏳";
        const text = document.createElement("span");
        text.textContent = labels.pending;
        ph.append(icon, text);
        media.appendChild(ph);
      }else{
        const ph = document.createElement("span");
        ph.className = "cert-placeholder";
        ph.textContent = d.cert_no_image;
        media.appendChild(ph);
      }
      card.appendChild(media);
      const content = document.createElement("div");
      content.className = "cert-content";
      if(c.verify_url){
        const verify = document.createElement("a");
        verify.className = "cert-verify";
        verify.href = c.verify_url;
        verify.target = "_blank";
        verify.rel = "noopener";
        verify.textContent = d.verify;
        content.appendChild(verify);
      }
      const titleRow = document.createElement("div");
      titleRow.className = "cert-title-row";
      const h3 = document.createElement("h3");
      h3.textContent = isAr ? c.title_ar : c.title_en;
      titleRow.appendChild(h3);
      if(c.pending){
        const statusBadge = document.createElement("span");
        statusBadge.className = "cert-status-badge";
        statusBadge.textContent = labels.pending;
        titleRow.appendChild(statusBadge);
      }
      content.appendChild(titleRow);

      const org = document.createElement("p");
      org.className = "org";
      org.textContent = isAr ? c.org_ar : c.org_en;
      if(c.org_logo){
        const orgRow = document.createElement("div");
        orgRow.className = "cert-org-row";
        const orgLogo = document.createElement("img");
        orgLogo.className = "cert-org-logo";
        orgLogo.src = c.org_logo;
        orgLogo.alt = isAr ? c.org_ar : c.org_en;
        orgLogo.loading = "lazy";
        orgRow.append(orgLogo, org);
        content.appendChild(orgRow);
      }else{
        content.appendChild(org);
      }

      const descText = isAr ? c.desc_ar : c.desc_en;
      if(descText){
        const desc = document.createElement("p");
        desc.className = "cert-desc";
        desc.textContent = descText;
        content.appendChild(desc);
      }

      if(c.pending){
        const pendingNote = document.createElement("p");
        pendingNote.className = "cert-pending-note";
        pendingNote.textContent = labels.pendingNote;
        content.appendChild(pendingNote);
      }else{
        const metaItems = [
          {label: labels.issued, value: isAr ? c.issued_ar : c.issued_en},
          {label: labels.period, value: isAr ? c.period_ar : c.period_en},
          {label: labels.number, value: c.certificate_number}
        ].filter(item=>item.value);
        if(metaItems.length){
          const meta = document.createElement("div");
          meta.className = "cert-meta";
          metaItems.forEach(item=>{
            const row = document.createElement("span");
            const label = document.createElement("b");
            label.textContent = item.label;
            const value = document.createElement("em");
            value.textContent = item.value;
            row.append(label, value);
            meta.appendChild(row);
          });
          content.appendChild(meta);
        }
      }

      if(tracks.length){
        const details = document.createElement("details");
        details.className = "cert-tracks";
        const summary = document.createElement("summary");
        summary.textContent = labels.tracks;
        details.appendChild(summary);
        const grid = document.createElement("div");
        grid.className = "cert-tracks-grid";
        tracks.forEach(track=>{
          const trackCard = document.createElement("div");
          trackCard.className = "cert-track";
          if(track.label){
            const label = document.createElement("span");
            label.className = "cert-track-label";
            label.textContent = track.label;
            trackCard.appendChild(label);
          }
          if(track.title){
            const title = document.createElement("h4");
            title.textContent = track.title;
            trackCard.appendChild(title);
          }
          if(track.description){
            const desc = document.createElement("p");
            desc.textContent = track.description;
            trackCard.appendChild(desc);
          }
          if(track.points?.length){
            const list = document.createElement("ul");
            track.points.forEach(point=>{
              const li = document.createElement("li");
              li.textContent = point;
              list.appendChild(li);
            });
            trackCard.appendChild(list);
          }
          grid.appendChild(trackCard);
        });
        details.appendChild(grid);
        content.appendChild(details);
      }
      if(related.length){
        const relatedWrap = document.createElement("div");
        relatedWrap.className = "cert-related";
        const relatedTitle = document.createElement("h4");
        relatedTitle.className = "cert-related-title";
        relatedTitle.textContent = labels.related;
        relatedWrap.appendChild(relatedTitle);
        const relatedGrid = document.createElement("div");
        relatedGrid.className = "cert-related-grid";
        related.forEach(item=>{
          const relatedItem = document.createElement(item.url ? "a" : "div");
          relatedItem.className = "cert-related-item";
          if(item.url){
            relatedItem.href = item.url;
            relatedItem.target = "_blank";
            relatedItem.rel = "noopener";
          }
          if(item.issuer){
            const issuer = document.createElement("span");
            issuer.className = "cert-related-issuer";
            issuer.textContent = item.issuer;
            relatedItem.appendChild(issuer);
          }
          if(item.title){
            const title = document.createElement("strong");
            title.textContent = item.title;
            relatedItem.appendChild(title);
          }
          if(item.issued){
            const issued = document.createElement("em");
            issued.textContent = item.issued;
            relatedItem.appendChild(issued);
          }
          if(item.description){
            const desc = document.createElement("p");
            desc.textContent = item.description;
            relatedItem.appendChild(desc);
          }
          relatedGrid.appendChild(relatedItem);
        });
        relatedWrap.appendChild(relatedGrid);
        content.appendChild(relatedWrap);
      }
      card.appendChild(content);
      wrap.appendChild(card);
    });
  }

  render();
  document.getElementById("langBtn").addEventListener("click", render);
});
</script>
</body>
</html>
