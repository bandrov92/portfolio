<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff" id="metaTheme">
<title>Bandarov — الرخص المهنية والاعتمادات</title>
<meta name="description" content="الرخص المهنية والاعتمادات الموثقة لبندر عايض الأسمري.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600&family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body class="inner">

<header class="topbar">
  <a class="brand" href="index.html#home"><img src="assets/images/logo.webp" alt="Bandarov logo"><b>BANDAROV</b></a>
  <nav class="site-nav" aria-label="Main">
    <a class="ctrl" href="index.html#home" data-i18n="nav_home">الرئيسية</a>
    <a class="ctrl" href="index.html#projects" data-i18n="nav_projects">المشاريع</a>
    <a class="ctrl" href="certificates.html" data-i18n="nav_credentials">الشهادات</a>
    <a class="ctrl is-active" href="licenses.html" aria-current="page" data-i18n="nav_licenses">الرخص</a>
    <a class="ctrl" href="badges.html" data-i18n="nav_badges">الشارات</a>
    <a class="ctrl" href="index.html#contact" data-i18n="nav_contact">تواصل</a>
  </nav>
  <div class="controls">
    <button class="ctrl" id="langBtn" aria-label="Switch language">EN</button>
    <button class="ctrl" id="themeBtn" aria-label="Toggle theme"><span id="themeIco">◐</span><span data-i18n="theme"></span></button>
  </div>
</header>

<section class="hero hero-page" id="hero">
  <div class="hero-mesh"></div>
  <span class="eyebrow" data-i18n="s_edu">التأهيل</span>
  <h1 class="display" data-i18n="licenses_hub_t">الرخص المهنية والاعتمادات</h1>
  <p class="lead" data-i18n="licenses_hub_p">مجموعة مختارة من الرخص والاعتمادات الرسمية الموثّقة — كل واحدة منها معلم فارق في المسار المهني.</p>
</section>

<section class="reveal in" id="licenseGrid">
  <div class="licenses-list" id="licenseCards"></div>
</section>

<footer><span data-i18n="footer">© 2026 بندر عايض الأسمري — Bandarov. جميع الحقوق محفوظة.</span></footer>

<script src="main.js" defer></script>
<script defer>
window.addEventListener("DOMContentLoaded", async ()=>{
  let licenses = [];
  try{
    const res = await fetch("data/licenses.json", { cache: "no-store" });
    const data = await res.json();
    licenses = data.licenses || [];
  }catch(e){
    licenses = [];
  }

  function render(){
    const isAr = document.documentElement.lang === "ar";
    const d = I18N[isAr?"ar":"en"];
    const labels = isAr ? {
      number: "رقم الاعتماد",
      validity: "الصلاحية"
    } : {
      number: "Credential No.",
      validity: "Validity"
    };
    document.title = "Bandarov — " + d.licenses_hub_t;
    const wrap = document.getElementById("licenseCards");
    wrap.innerHTML = "";
    licenses.forEach((l, i)=>{
      const card = document.createElement("article");
      card.className = "card license-card";

      const emblem = document.createElement("div");
      emblem.className = "license-emblem";
      const emblemInner = document.createElement("div");
      emblemInner.className = "license-emblem-inner";
      if(l.image){
        const img = document.createElement("img");
        img.src = l.image;
        img.alt = isAr ? l.title_ar : l.title_en;
        img.loading = "lazy";
        emblemInner.appendChild(img);
      }else{
        const icon = document.createElement("span");
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = l.icon || "🎖️";
        emblemInner.appendChild(icon);
      }
      emblem.appendChild(emblemInner);
      card.appendChild(emblem);

      const content = document.createElement("div");
      content.className = "license-content";

      const num = document.createElement("span");
      num.className = "license-num";
      num.textContent = String(i+1).padStart(2,"0");
      content.appendChild(num);

      const titleRow = document.createElement("div");
      titleRow.className = "license-title-row";
      const h3 = document.createElement("h3");
      h3.textContent = isAr ? l.title_ar : l.title_en;
      titleRow.appendChild(h3);
      const status = isAr ? l.status_ar : l.status_en;
      if(status){
        const badge = document.createElement("span");
        badge.className = "license-status-badge";
        badge.textContent = status;
        titleRow.appendChild(badge);
      }
      content.appendChild(titleRow);

      const org = isAr ? l.org_ar : l.org_en;
      if(org){
        const orgEl = document.createElement("p");
        orgEl.className = "license-org";
        orgEl.textContent = org;
        content.appendChild(orgEl);
      }

      const descText = isAr ? l.desc_ar : l.desc_en;
      if(descText){
        const desc = document.createElement("p");
        desc.className = "license-desc";
        desc.textContent = descText;
        content.appendChild(desc);
      }

      const stats = (isAr ? l.stats_ar : l.stats_en) || [];
      if(stats.length){
        const statsWrap = document.createElement("div");
        statsWrap.className = "license-stats";
        stats.forEach(s=>{
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.innerHTML = s;
          statsWrap.appendChild(chip);
        });
        content.appendChild(statsWrap);
      }

      const metaItems = [
        {label: labels.number, value: l.credential_number},
        {label: labels.validity, value: isAr ? l.period_ar : l.period_en}
      ].filter(item=>item.value);
      if(metaItems.length){
        const meta = document.createElement("div");
        meta.className = "license-meta";
        metaItems.forEach(item=>{
          const row = document.createElement("span");
          const label = document.createElement("b");
          label.textContent = item.label;
          const value = document.createElement("em");
          value.textContent = item.value;
          row.append(label, value);
          meta.appendChild(row);
        });
        content.appendChild(meta);
      }

      if(l.verify_url){
        const verify = document.createElement("a");
        verify.className = "btn btn-ghost license-verify-btn";
        verify.href = l.verify_url;
        verify.target = "_blank";
        verify.rel = "noopener";
        verify.textContent = d.verify;
        content.appendChild(verify);
      }

      card.appendChild(content);
      wrap.appendChild(card);
    });
  }

  render();
  document.getElementById("langBtn").addEventListener("click", render);
});
</script>
</body>
</html>
