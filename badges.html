<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff" id="metaTheme">
<script src="preferences.js?v=20260909-1"></script>
<title>Bandarov — الشارات الرقمية</title>
<meta name="description" content="الشارات الرقمية الموثّقة لبندر عايض الأسمري.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600&family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css?v=20260909-1">
<link rel="stylesheet" href="css/pages.css?v=20260909-1">
</head>
<body class="inner">

<header class="topbar">
  <a class="brand" href="index.html#home"><img src="assets/images/logo.webp" alt="Bandarov logo"><b>BANDAROV</b></a>
  <nav class="site-nav" aria-label="Main">
    <a class="ctrl" href="index.html#home" data-i18n="nav_home">الرئيسية</a>
    <a class="ctrl" href="index.html#projects" data-i18n="nav_projects">المشاريع</a>
    <a class="ctrl" href="certificates.html" data-i18n="nav_credentials">الشهادات</a>
    <a class="ctrl" href="licenses.html" data-i18n="nav_licenses">الرخص</a>
    <a class="ctrl is-active" href="badges.html" aria-current="page" data-i18n="nav_badges">الشارات</a>
    <a class="ctrl" href="contact.html" data-i18n="nav_contact">تواصل</a>
  </nav>
  <div class="controls">
    <button class="ctrl" id="langBtn" aria-label="Switch language">EN</button>
    <button class="ctrl" id="themeBtn" aria-label="Toggle theme"><span id="themeIco">◐</span><span data-i18n="theme"></span></button>
  </div>
</header>

<section class="hero hero-page" id="hero">
  <div class="hero-mesh"></div>
  <span class="eyebrow" data-i18n="nav_badges">الشارات</span>
  <h1 class="display" data-i18n="badges_hub_t">الشارات الرقمية</h1>
  <p class="lead" data-i18n="badges_hub_p">شارات رقمية موثّقة تُعرض مباشرة من منصات التحقق الرسمية.</p>
</section>

<section class="reveal in" id="badgeGrid">
  <div class="grid badges-grid" id="badgeCards"></div>
  <div class="section-cta badges-cta">
    <a class="btn btn-gold" id="badgesCredlyCta" href="https://www.credly.com/users/bandarov/badges/credly" target="_blank" rel="noopener"></a>
  </div>
</section>

<footer><span data-i18n="footer">© 2026 بندر عايض الأسمري — Bandarov. جميع الحقوق محفوظة.</span></footer>

<script src="main.js?v=20260909-1" defer></script>
<script defer>
window.addEventListener("DOMContentLoaded", async ()=>{
  let badges = [];
  try{
    const res = await fetch("data/badges.json", { cache: "no-store" });
    const data = await res.json();
    badges = data.badges || [];
  }catch(e){
    badges = [];
  }

  function render(){
    const isAr = document.documentElement.lang === "ar";
    const d = I18N[isAr?"ar":"en"];
    const labels = isAr ? {
      cta: "استعرض كافة الشارات وتفاصيل التوثيق الرسمية ↗"
    } : {
      cta: "Browse all badges and official verification details ↗"
    };
    document.title = "Bandarov — " + d.badges_hub_t;
    document.getElementById("badgesCredlyCta").textContent = labels.cta;

    const wrap = document.getElementById("badgeCards");
    wrap.innerHTML = "";

    badges.forEach((b, idx)=>{
      const card = document.createElement("a");
      card.className = "card badge-card reveal-stagger";
      card.href = b.verify_url || "#";
      card.target = "_blank";
      card.rel = "noopener";
      card.style.transitionDelay = Math.min(idx * 70, 420) + "ms";

      const media = document.createElement("div");
      media.className = "badge-media-wrap";
      if(b.image){
        const img = document.createElement("img");
        img.src = b.image;
        img.alt = isAr ? b.title_ar : b.title_en;
        img.loading = "lazy";
        media.appendChild(img);
      }else{
        const ph = document.createElement("span");
        ph.className = "cert-placeholder";
        ph.textContent = d.badge_no_image;
        media.appendChild(ph);
      }
      card.appendChild(media);

      const h3 = document.createElement("h3");
      h3.textContent = isAr ? b.title_ar : b.title_en;
      card.appendChild(h3);

      const org = document.createElement("p");
      org.className = "badge-org";
      org.textContent = isAr ? b.org_ar : b.org_en;
      card.appendChild(org);

      const skills = (isAr ? b.skills_ar : b.skills_en) || [];
      if(skills.length){
        const skillsWrap = document.createElement("div");
        skillsWrap.className = "badge-skills";
        skills.forEach(skill=>{
          const pill = document.createElement("span");
          pill.className = "badge-skill-pill";
          pill.textContent = skill;
          skillsWrap.appendChild(pill);
        });
        card.appendChild(skillsWrap);
      }

      wrap.appendChild(card);
    });

    const badgeRevealObs = new IntersectionObserver(es=>{
      es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); badgeRevealObs.unobserve(e.target); } });
    }, {threshold:.12});
    wrap.querySelectorAll(".reveal-stagger").forEach(el=>badgeRevealObs.observe(el));
  }

  render();
  document.getElementById("langBtn").addEventListener("click", render);
});
</script>
</body>
</html>
