name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write Worker secrets file
        run: |
          echo "GITHUB_CLIENT_ID=${{ secrets.CMS_CLIENT_ID }}" > .worker-secrets
          echo "GITHUB_CLIENT_SECRET=${{ secrets.CMS_CLIENT_SECRET }}" >> .worker-secrets

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --secrets-file .worker-secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Clean up secrets file
        if: always()
        run: rm -f .worker-secrets
