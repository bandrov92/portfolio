<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff" id="metaTheme">
<script src="preferences.js?v=20260909-1"></script>
<title>Bandarov — مشروع</title>
<meta name="description" content="دراسة حالة لمشروع تقني تعليمي من أعمال بندر عايض الأسمري.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600&family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css?v=20260909-1">
<link rel="stylesheet" href="css/pages.css?v=20260909-1">
</head>
<body class="inner">

<header class="topbar">
  <a class="brand" href="index.html#home"><img src="assets/images/logo.webp" alt="Bandarov logo"><b>BANDAROV</b></a>
  <nav class="site-nav" aria-label="Main">
    <a class="ctrl" href="index.html#home" data-i18n="nav_home">الرئيسية</a>
    <a class="ctrl is-active" href="index.html#projects" aria-current="page" data-i18n="nav_projects">المشاريع</a>
    <a class="ctrl" href="certificates.html" data-i18n="nav_credentials">الشهادات</a>
    <a class="ctrl" href="licenses.html" data-i18n="nav_licenses">الرخص</a>
    <a class="ctrl" href="badges.html" data-i18n="nav_badges">الشارات</a>
    <a class="ctrl" href="contact.html" data-i18n="nav_contact">تواصل</a>
  </nav>
  <div class="controls">
    <button class="ctrl" id="langBtn" aria-label="Switch language">EN</button>
    <button class="ctrl" id="themeBtn" aria-label="Toggle theme"><span id="themeIco">◐</span><span data-i18n="theme"></span></button>
  </div>
</header>

<section class="hero hero-page" id="hero">
  <div class="hero-mesh"></div>
  <img id="projLogo" class="proj-logo" src="" alt="" style="display:none">
  <span class="eyebrow" data-i18n="s_proj">الأعمال</span>
  <h1 class="display" id="projTitle">—</h1>
  <p class="lead page-block" id="projSummary">—</p>
  <div class="chips" id="projQuickFacts" style="display:none;justify-content:center"></div>
  <div class="hero-cta">
    <a class="btn btn-gold" id="projLiveBtn" href="#" target="_blank" rel="noopener" data-i18n="proj_visit" style="display:none">زيارة المشروع الحي</a>
    <a class="btn btn-ghost" href="index.html#projects" data-i18n="proj_back">كل المشاريع</a>
  </div>
</section>

<section class="reveal in case-study" id="projectCaseStudy" style="display:none">
  <span class="eyebrow" id="caseEyebrow">دراسة حالة</span>
  <h2 class="display" id="caseHeadline"></h2>
  <p class="lead page-block" id="caseContext"></p>

  <div class="case-grid" id="caseCards"></div>

  <div class="case-updates" id="caseUpdatesBlock" style="display:none">
    <h3 id="caseUpdatesTitle"></h3>
    <ul id="caseUpdates"></ul>
  </div>

  <blockquote class="case-lesson" id="caseLesson"></blockquote>
</section>

<section class="reveal in" id="secOverview" style="display:none">
  <span class="eyebrow" id="ovEyebrow"></span>
  <h2 class="display" id="ovTitle"></h2>
  <p class="lead page-block" id="ovText"></p>
</section>

<section class="reveal in" id="secChallenge" style="display:none">
  <span class="eyebrow" id="chEyebrow"></span>
  <h2 class="display" id="chTitle"></h2>
  <ul class="case-bullets" id="chList"></ul>
</section>

<section class="reveal in" id="secSolution" style="display:none">
  <span class="eyebrow" id="soEyebrow"></span>
  <h2 class="display" id="soTitle"></h2>
  <ul class="case-bullets" id="soList"></ul>
</section>

<section class="reveal in" id="secRole" style="display:none">
  <span class="eyebrow" id="roEyebrow"></span>
  <h2 class="display" id="roTitle"></h2>
  <ul class="role-list" id="roList"></ul>
</section>

<section class="reveal in" id="secCompetencies" style="display:none">
  <span class="eyebrow" id="coEyebrow"></span>
  <h2 class="display" id="coTitle"></h2>
  <div class="grid g3" id="coGrid"></div>
</section>

<section class="reveal in" id="secOutputs" style="display:none">
  <span class="eyebrow" id="ouEyebrow"></span>
  <h2 class="display" id="ouTitle"></h2>
  <ul class="case-bullets" id="ouList"></ul>
</section>

<section class="reveal in" id="secLessons" style="display:none">
  <span class="eyebrow" id="leEyebrow"></span>
  <h2 class="display" id="leTitle"></h2>
  <p class="lead page-block" id="leText"></p>
  <blockquote class="case-lesson" id="leQuote"></blockquote>
</section>

<section class="reveal in" id="secTags" style="display:none">
  <span class="eyebrow" id="taEyebrow"></span>
  <h2 class="display" id="taTitle"></h2>
  <div class="chips tags-row" id="taList"></div>
</section>

<section class="reveal in" id="projNotFound" style="display:none">
  <h2 class="display" data-i18n="proj_404_t">المشروع غير موجود</h2>
  <p class="lead" data-i18n="proj_404_p">تعذّر العثور على هذا المشروع. عد إلى قائمة المشاريع.</p>
</section>

<footer><span data-i18n="footer">© 2026 بندر عايض الأسمري — Bandarov. جميع الحقوق محفوظة.</span></footer>

<script src="main.js?v=20260909-1" defer></script>
<script defer>
window.addEventListener("DOMContentLoaded", async ()=>{
  const slug = new URLSearchParams(location.search).get("slug");
  let project = null;
  let projectLoadFailed = false;
  if(slug){
    try{
      const res = await fetch("data/projects/" + slug + ".json", { cache: "no-store" });
      project = res.ok ? await res.json() : null;
    }catch(e){
      projectLoadFailed = true;
      project = null;
    }
  }

  function render(){
    const titleEl = document.getElementById("projTitle");
    const summaryEl = document.getElementById("projSummary");
    const liveBtn = document.getElementById("projLiveBtn");
    const notFound = document.getElementById("projNotFound");
    const hero = document.getElementById("hero");
    const caseStudy = document.getElementById("projectCaseStudy");
    const isAr = document.documentElement.lang === "ar";
    const isFilePreview = location.protocol === "file:";
    const labels = isAr ? {
      eyebrow: "دراسة حالة",
      challenge: "التحدي",
      solution: "الحل",
      impact: "الأثر",
      updates: "ما تغيّر في النسخة الثانية"
    } : {
      eyebrow: "Case study",
      challenge: "Challenge",
      solution: "Solution",
      impact: "Impact",
      updates: "What changed in the second release"
    };
    const pick = (obj, key)=> obj?.[key + (isAr ? "_ar" : "_en")] || obj?.[key + "_ar"] || obj?.[key + "_en"] || "";

    if(!project){
      hero.style.display = "none";
      caseStudy.style.display = "none";
      notFound.style.display = "";
      const titleEl = notFound.querySelector("h2");
      const textEl = notFound.querySelector("p");
      const needsServer = isFilePreview || projectLoadFailed;
      const title = needsServer
        ? (isAr ? "المعاينة تحتاج خادماً محلياً" : "Local preview requires a server")
        : (isAr ? "المشروع غير موجود" : "Project not found");
      const message = needsServer
        ? (isAr
          ? "هذه الصفحة تجلب بيانات المشروع من ملفات JSON، وفتحها مباشرة من الجهاز بصيغة file:// قد يمنع المتصفح تحميل البيانات. افتحها عبر رابط محلي يبدأ بـ http://."
          : "This page loads project data from JSON files. Opening it directly as file:// may block the browser from loading that data. Use a local http:// preview instead.")
        : (isAr ? "تعذّر العثور على هذا المشروع. عد إلى قائمة المشاريع." : "We couldn't find this project. Return to the projects list.");
      titleEl.textContent = title;
      textEl.textContent = message;
      document.title = "Bandarov — " + title;
      return;
    }

    hero.style.display = "";
    notFound.style.display = "none";
    const logoEl = document.getElementById("projLogo");
    if(project.logo){
      logoEl.src = project.logo;
      logoEl.alt = isAr ? project.title_ar : project.title_en;
      logoEl.style.display = "";
    }else{
      logoEl.style.display = "none";
    }
    titleEl.textContent = isAr ? project.title_ar : project.title_en;
    summaryEl.textContent = isAr ? project.summary_ar : project.summary_en;
    document.title = "Bandarov — " + (isAr ? project.title_ar : project.title_en);
    const metaDesc = document.querySelector('meta[name="description"]');
    if(metaDesc) metaDesc.setAttribute("content", isAr ? project.summary_ar : project.summary_en);

    if(project.url){
      liveBtn.href = project.url;
      liveBtn.style.display = "";
    }else{
      liveBtn.style.display = "none";
    }

    const caseData = project.case_study || null;

    // Quick facts chips (hero info card) — works independently of the case-study body.
    const quickFactsWrap = document.getElementById("projQuickFacts");
    const quickFacts = (caseData && Array.isArray(caseData.quick_facts)) ? caseData.quick_facts : [];
    quickFactsWrap.innerHTML = "";
    if(quickFacts.length){
      quickFacts.forEach(f=>{
        const label = (isAr ? f.label_ar : f.label_en) || f.label_ar || f.label_en || "";
        const value = (isAr ? f.value_ar : f.value_en) || f.value_ar || f.value_en || "";
        if(!label && !value) return;
        const span = document.createElement("span");
        span.className = "chip";
        const b = document.createElement("b");
        b.textContent = label;
        span.appendChild(b);
        span.append(document.createTextNode("\u00A0" + value));
        quickFactsWrap.appendChild(span);
      });
      quickFactsWrap.style.display = "";
    }else{
      quickFactsWrap.style.display = "none";
    }

    const extLabels = isAr ? {
      overview: "نظرة عامة",
      role: "دوري في المشروع",
      competencies: "الكفاءات التي يجسدها المشروع",
      outputs: "أبرز المخرجات",
      lessons: "الدروس المهنية المستفادة",
      tags: "الكلمات المفتاحية المهنية"
    } : {
      overview: "Overview",
      role: "My Role",
      competencies: "Competencies Demonstrated",
      outputs: "Key Outputs",
      lessons: "Professional Lessons Learned",
      tags: "Professional Keywords"
    };
    const pickList = (obj, key)=>{
      const primary = obj?.[key + (isAr ? "_ar" : "_en")];
      if(Array.isArray(primary) && primary.length) return primary;
      const fallback = obj?.[key + "_ar"] || obj?.[key + "_en"];
      return Array.isArray(fallback) ? fallback : [];
    };
    const pickItemField = (item, key)=> item?.[key] ?? (item?.[key + "_ar"] || item?.[key + "_en"] || "");

    const extendedSectionIds = ["secOverview","secChallenge","secSolution","secRole","secCompetencies","secOutputs","secLessons","secTags"];

    if(!caseData){
      caseStudy.style.display = "none";
      extendedSectionIds.forEach(id=> document.getElementById(id).style.display = "none");
      return;
    }

    const overviewText = pick(caseData, "overview");
    const challengeItems = pickList(caseData, "challenge_items");
    const solutionItems = pickList(caseData, "solution_items");
    const roleItems = pickList(caseData, "role_items");
    const competencies = pickList(caseData, "competencies");
    const outputItems = pickList(caseData, "outputs");
    const keyTakeaway = pick(caseData, "key_takeaway");
    const tags = pickList(caseData, "tags");

    const isExtended = !!(overviewText || challengeItems.length || solutionItems.length || roleItems.length || competencies.length || outputItems.length || keyTakeaway || tags.length);

    if(isExtended){
      caseStudy.style.display = "none";

      const setSection = (id, eyebrowId, titleId, eyebrowText, titleText, hasContent)=>{
        const section = document.getElementById(id);
        if(!hasContent){ section.style.display = "none"; return; }
        section.style.display = "";
        document.getElementById(eyebrowId).textContent = eyebrowText;
        document.getElementById(titleId).textContent = titleText;
      };

      // Overview
      setSection("secOverview","ovEyebrow","ovTitle", labels.eyebrow, extLabels.overview, !!overviewText);
      document.getElementById("ovText").textContent = overviewText;

      // Challenge
      setSection("secChallenge","chEyebrow","chTitle", labels.eyebrow, labels.challenge, challengeItems.length>0);
      const chList = document.getElementById("chList");
      chList.innerHTML = "";
      challengeItems.forEach(text=>{
        const li = document.createElement("li");
        li.textContent = text;
        chList.appendChild(li);
      });

      // Solution
      setSection("secSolution","soEyebrow","soTitle", labels.eyebrow, labels.solution, solutionItems.length>0);
      const soList = document.getElementById("soList");
      soList.innerHTML = "";
      solutionItems.forEach(text=>{
        const li = document.createElement("li");
        li.textContent = text;
        soList.appendChild(li);
      });

      // Role (first person)
      setSection("secRole","roEyebrow","roTitle", labels.eyebrow, extLabels.role, roleItems.length>0);
      const roList = document.getElementById("roList");
      roList.innerHTML = "";
      roleItems.forEach(text=>{
        const li = document.createElement("li");
        li.textContent = text;
        roList.appendChild(li);
      });

      // Competencies
      setSection("secCompetencies","coEyebrow","coTitle", labels.eyebrow, extLabels.competencies, competencies.length>0);
      const coGrid = document.getElementById("coGrid");
      coGrid.innerHTML = "";
      competencies.forEach(item=>{
        const card = document.createElement("div");
        card.className = "card";
        const h3 = document.createElement("h3");
        h3.textContent = pickItemField(item, "title");
        const p = document.createElement("p");
        p.textContent = pickItemField(item, "desc");
        card.append(h3, p);
        coGrid.appendChild(card);
      });

      // Key outputs
      setSection("secOutputs","ouEyebrow","ouTitle", labels.eyebrow, extLabels.outputs, outputItems.length>0);
      const ouList = document.getElementById("ouList");
      ouList.innerHTML = "";
      outputItems.forEach(text=>{
        const li = document.createElement("li");
        li.textContent = text;
        ouList.appendChild(li);
      });

      // Lessons learned
      const lessonText = pick(caseData, "lesson");
      setSection("secLessons","leEyebrow","leTitle", labels.eyebrow, extLabels.lessons, !!(lessonText || keyTakeaway));
      const leTextEl = document.getElementById("leText");
      leTextEl.textContent = lessonText;
      leTextEl.style.display = lessonText ? "" : "none";
      const leQuoteEl = document.getElementById("leQuote");
      leQuoteEl.textContent = keyTakeaway;
      leQuoteEl.style.display = keyTakeaway ? "" : "none";

      // Tags
      setSection("secTags","taEyebrow","taTitle", labels.eyebrow, extLabels.tags, tags.length>0);
      const taList = document.getElementById("taList");
      taList.innerHTML = "";
      tags.forEach(text=>{
        const span = document.createElement("span");
        span.className = "chip tag-pill";
        span.textContent = text;
        taList.appendChild(span);
      });

      return;
    }

    // Legacy simple case-study rendering (headline/context/challenge/solution/impact/updates/lesson as plain text)
    extendedSectionIds.forEach(id=> document.getElementById(id).style.display = "none");

    const headline = pick(caseData, "headline");
    const context = pick(caseData, "context");
    const lesson = pick(caseData, "lesson");
    const cards = [
      {title: labels.challenge, text: pick(caseData, "challenge")},
      {title: labels.solution, text: pick(caseData, "solution")},
      {title: labels.impact, text: pick(caseData, "impact")}
    ].filter(item=>item.text);
    const updates = caseData[isAr ? "updates_ar" : "updates_en"] || caseData.updates_ar || caseData.updates_en || [];

    if(!headline && !context && !lesson && !cards.length && !updates.length){
      caseStudy.style.display = "none";
      return;
    }

    caseStudy.style.display = "";
    document.getElementById("caseEyebrow").textContent = labels.eyebrow;
    document.getElementById("caseHeadline").textContent = headline;
    document.getElementById("caseHeadline").style.display = headline ? "" : "none";
    document.getElementById("caseContext").textContent = context;
    document.getElementById("caseContext").style.display = context ? "" : "none";

    const cardWrap = document.getElementById("caseCards");
    cardWrap.innerHTML = "";
    cards.forEach((item, index)=>{
      const card = document.createElement("article");
      card.className = "case-card";
      const num = document.createElement("div");
      num.className = "case-num";
      num.textContent = String(index + 1).padStart(2, "0");
      const h3 = document.createElement("h3");
      h3.textContent = item.title;
      const p = document.createElement("p");
      p.textContent = item.text;
      card.append(num, h3, p);
      cardWrap.appendChild(card);
    });

    const updatesBlock = document.getElementById("caseUpdatesBlock");
    const updatesList = document.getElementById("caseUpdates");
    updatesList.innerHTML = "";
    if(updates.length){
      document.getElementById("caseUpdatesTitle").textContent = labels.updates;
      updates.forEach(text=>{
        const li = document.createElement("li");
        li.textContent = text;
        updatesList.appendChild(li);
      });
      updatesBlock.style.display = "";
    }else{
      updatesBlock.style.display = "none";
    }

    const lessonEl = document.getElementById("caseLesson");
    lessonEl.textContent = lesson;
    lessonEl.style.display = lesson ? "" : "none";
  }

  render();
  document.getElementById("langBtn").addEventListener("click", render);
});
</script>
</body>
</html>
