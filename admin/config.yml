backend:
  name: github
  repo: bandrov92/portfolio
  branch: master
  base_url: https://bandaralasmari.com
  auth_endpoint: api/auth

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "projects"
    label: "المشاريع"
    folder: "data/projects"
    create: true
    extension: "json"
    format: "json"
    slug: "{{fields.slug}}"
    identifier_field: "title_ar"
    fields:
      - {label: "معرّف داخلي", name: "id", widget: "hidden", default: ""}
      - {label: "المعرّف في الرابط (slug)", name: "slug", widget: "string", hint: "بالإنجليزية وبدون مسافات، مثال: my-new-project — يظهر في رابط الصفحة"}
      - {label: "العنوان (عربي)", name: "title_ar", widget: "string"}
      - {label: "العنوان (Title EN)", name: "title_en", widget: "string"}
      - {label: "الوصف (عربي)", name: "summary_ar", widget: "text"}
      - {label: "الوصف (Summary EN)", name: "summary_en", widget: "text"}
      - {label: "رابط المشروع الخارجي (اختياري)", name: "url", widget: "string", required: false, default: ""}
      - {label: "شعار المشروع (اختياري)", name: "logo", widget: "image", required: false, default: "", hint: "يظهر أعلى عنوان المشروع في صفحة دراسة الحالة", media_folder: "/assets/images/projects", public_folder: "/assets/images/projects"}
      - label: "دراسة حالة موسعة (اختياري)"
        name: "case_study"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - {label: "عنوان دراسة الحالة (عربي)", name: "headline_ar", widget: "string", required: false, default: ""}
          - {label: "عنوان دراسة الحالة (EN)", name: "headline_en", widget: "string", required: false, default: ""}
          - {label: "السياق (عربي)", name: "context_ar", widget: "text", required: false, default: ""}
          - {label: "السياق (EN)", name: "context_en", widget: "text", required: false, default: ""}
          - {label: "التحدي (عربي)", name: "challenge_ar", widget: "text", required: false, default: ""}
          - {label: "التحدي (EN)", name: "challenge_en", widget: "text", required: false, default: ""}
          - {label: "الحل (عربي)", name: "solution_ar", widget: "text", required: false, default: ""}
          - {label: "الحل (EN)", name: "solution_en", widget: "text", required: false, default: ""}
          - {label: "الأثر (عربي)", name: "impact_ar", widget: "text", required: false, default: ""}
          - {label: "الأثر (EN)", name: "impact_en", widget: "text", required: false, default: ""}
          - label: "ما تغيّر في النسخة الثانية (عربي)"
            name: "updates_ar"
            widget: "list"
            required: false
            field: {label: "نقطة", name: "item", widget: "string"}
          - label: "What changed in the second release (EN)"
            name: "updates_en"
            widget: "list"
            required: false
            field: {label: "Point", name: "item", widget: "string"}
          - {label: "الدرس المستفاد (عربي)", name: "lesson_ar", widget: "text", required: false, default: ""}
          - {label: "Lesson learned (EN)", name: "lesson_en", widget: "text", required: false, default: ""}
          - {label: "أبرز قيمة مستفادة — مقتبس مميّز (عربي)", name: "key_takeaway_ar", widget: "text", required: false, default: ""}
          - {label: "Key takeaway — highlighted quote (EN)", name: "key_takeaway_en", widget: "text", required: false, default: ""}
          - label: "بطاقة معلومات سريعة (Hero)"
            name: "quick_facts"
            widget: "list"
            required: false
            collapsed: true
            summary: "{{label_ar}}: {{value_ar}}"
            fields:
              - {label: "التسمية (عربي)", name: "label_ar", widget: "string", required: false, default: ""}
              - {label: "Label (EN)", name: "label_en", widget: "string", required: false, default: ""}
              - {label: "القيمة (عربي)", name: "value_ar", widget: "string", required: false, default: ""}
              - {label: "Value (EN)", name: "value_en", widget: "string", required: false, default: ""}
          - {label: "نظرة عامة — نص موسّع (عربي)", name: "overview_ar", widget: "text", required: false, default: ""}
          - {label: "Overview — extended text (EN)", name: "overview_en", widget: "text", required: false, default: ""}
          - label: "بنود التحدي (عربي، بديل موسّع عن حقل التحدي أعلاه)"
            name: "challenge_items_ar"
            widget: "list"
            required: false
            field: {label: "بند", name: "item", widget: "string"}
          - label: "Challenge items (EN)"
            name: "challenge_items_en"
            widget: "list"
            required: false
            field: {label: "Item", name: "item", widget: "string"}
          - label: "بنود الحل (عربي، بديل موسّع عن حقل الحل أعلاه)"
            name: "solution_items_ar"
            widget: "list"
            required: false
            field: {label: "بند", name: "item", widget: "string"}
          - label: "Solution items (EN)"
            name: "solution_items_en"
            widget: "list"
            required: false
            field: {label: "Item", name: "item", widget: "string"}
          - label: "دوري في المشروع — بصيغة المتكلم (عربي)"
            name: "role_items_ar"
            widget: "list"
            required: false
            field: {label: "بند", name: "item", widget: "string"}
          - label: "My role — first person (EN)"
            name: "role_items_en"
            widget: "list"
            required: false
            field: {label: "Item", name: "item", widget: "string"}
          - label: "الكفاءات التي يجسدها المشروع (عربي)"
            name: "competencies_ar"
            widget: "list"
            required: false
            collapsed: true
            summary: "{{title}}"
            fields:
              - {label: "عنوان الكفاءة", name: "title", widget: "string"}
              - {label: "الوصف", name: "desc", widget: "text"}
          - label: "Competencies demonstrated (EN)"
            name: "competencies_en"
            widget: "list"
            required: false
            collapsed: true
            summary: "{{title}}"
            fields:
              - {label: "Competency title", name: "title", widget: "string"}
              - {label: "Description", name: "desc", widget: "text"}
          - label: "أبرز المخرجات (عربي)"
            name: "outputs_ar"
            widget: "list"
            required: false
            field: {label: "بند", name: "item", widget: "string"}
          - label: "Key outputs (EN)"
            name: "outputs_en"
            widget: "list"
            required: false
            field: {label: "Item", name: "item", widget: "string"}
          - label: "الكلمات المفتاحية المهنية (عربي)"
            name: "tags_ar"
            widget: "list"
            required: false
            field: {label: "كلمة", name: "item", widget: "string"}
          - label: "Professional keywords (EN)"
            name: "tags_en"
            widget: "list"
            required: false
            field: {label: "Keyword", name: "item", widget: "string"}

  - name: "certificates"
    label: "الشهادات التدريبية"
    files:
      - name: "certificates"
        label: "قائمة الشهادات التدريبية"
        file: "data/certificates.json"
        fields:
          - label: "الشهادات"
            name: "certificates"
            widget: "list"
            summary: "{{title_ar}}"
            fields:
              - {label: "معرّف داخلي", name: "id", widget: "hidden", default: ""}
              - {label: "العنوان (عربي)", name: "title_ar", widget: "string"}
              - {label: "العنوان (Title EN)", name: "title_en", widget: "string"}
              - {label: "الجهة المانحة (عربي)", name: "org_ar", widget: "string"}
              - {label: "الجهة المانحة (Issuer EN)", name: "org_en", widget: "string"}
              - {label: "شعار الجهة المانحة (اختياري)", name: "org_logo", widget: "image", required: false, default: "", hint: "يظهر بجوار اسم الجهة المانحة في البطاقة", media_folder: "/assets/images", public_folder: "/assets/images"}
              - {label: "الشهادة قيد الإصدار (بدون تاريخ/رقم نهائي)", name: "pending", widget: "boolean", required: false, default: false, hint: "عند التفعيل: يُستبدل تاريخ الإصدار ورقم الشهادة بنص 'في مراحل الاعتماد النهائية'، وتُضاف شارة 'قيد الإصدار'"}
              - {label: "وصف مختصر (عربي)", name: "desc_ar", widget: "text", required: false, default: ""}
              - {label: "Short description (EN)", name: "desc_en", widget: "text", required: false, default: ""}
              - {label: "تاريخ الإصدار (عربي)", name: "issued_ar", widget: "string", required: false, default: ""}
              - {label: "Issued date (EN)", name: "issued_en", widget: "string", required: false, default: ""}
              - {label: "مدة البرنامج (عربي)", name: "period_ar", widget: "string", required: false, default: ""}
              - {label: "Program period (EN)", name: "period_en", widget: "string", required: false, default: ""}
              - {label: "رقم الشهادة", name: "certificate_number", widget: "string", required: false, default: ""}
              - label: "محاور الشهادة (عربي)"
                name: "tracks_ar"
                widget: "list"
                required: false
                collapsed: true
                fields:
                  - {label: "المسمى الفرعي", name: "label", widget: "string", required: false, default: ""}
                  - {label: "عنوان المحور", name: "title", widget: "string"}
                  - {label: "وصف المحور", name: "description", widget: "text", required: false, default: ""}
                  - label: "النقاط"
                    name: "points"
                    widget: "list"
                    required: false
                    field: {label: "نقطة", name: "item", widget: "string"}
              - label: "Certificate tracks (EN)"
                name: "tracks_en"
                widget: "list"
                required: false
                collapsed: true
                fields:
                  - {label: "Label", name: "label", widget: "string", required: false, default: ""}
                  - {label: "Track title", name: "title", widget: "string"}
                  - {label: "Track description", name: "description", widget: "text", required: false, default: ""}
                  - label: "Points"
                    name: "points"
                    widget: "list"
                    required: false
                    field: {label: "Point", name: "item", widget: "string"}
              - label: "شهادات/مسارات مرتبطة (عربي)"
                name: "related_credentials_ar"
                widget: "list"
                required: false
                collapsed: true
                fields:
                  - {label: "عنوان الشهادة", name: "title", widget: "string"}
                  - {label: "الجهة", name: "issuer", widget: "string", required: false, default: ""}
                  - {label: "تاريخ الإصدار", name: "issued", widget: "string", required: false, default: ""}
                  - {label: "وصف مختصر", name: "description", widget: "text", required: false, default: ""}
                  - {label: "رابط التحقق أو المشاركة", name: "url", widget: "string", required: false, default: ""}
              - label: "Related credentials (EN)"
                name: "related_credentials_en"
                widget: "list"
                required: false
                collapsed: true
                fields:
                  - {label: "Certificate title", name: "title", widget: "string"}
                  - {label: "Issuer", name: "issuer", widget: "string", required: false, default: ""}
                  - {label: "Issued date", name: "issued", widget: "string", required: false, default: ""}
                  - {label: "Short description", name: "description", widget: "text", required: false, default: ""}
                  - {label: "Verification or share URL", name: "url", widget: "string", required: false, default: ""}
              - {label: "صورة الشهادة (اختياري)", name: "image", widget: "image", required: false, default: "", media_folder: "/assets/images/certs", public_folder: "/assets/images/certs"}
              - {label: "رابط التحقق (اختياري)", name: "verify_url", widget: "string", required: false, default: ""}

  - name: "licenses"
    label: "الرخص المهنية والاعتمادات"
    files:
      - name: "licenses"
        label: "قائمة الرخص والاعتمادات"
        file: "data/licenses.json"
        fields:
          - label: "الرخص"
            name: "licenses"
            widget: "list"
            summary: "{{title_ar}}"
            fields:
              - {label: "معرّف داخلي", name: "id", widget: "hidden", default: ""}
              - {label: "أيقونة الشعار (اختياري، رمز تعبيري مثل 🎓)", name: "icon", widget: "string", required: false, default: "🎖️", hint: "تظهر داخل الميدالية عند عدم وجود صورة"}
              - {label: "العنوان (عربي)", name: "title_ar", widget: "string"}
              - {label: "العنوان (Title EN)", name: "title_en", widget: "string"}
              - {label: "الجهة المانحة (عربي)", name: "org_ar", widget: "string", required: false, default: ""}
              - {label: "الجهة المانحة (Issuer EN)", name: "org_en", widget: "string", required: false, default: ""}
              - {label: "الوصف (عربي)", name: "desc_ar", widget: "text"}
              - {label: "الوصف (Description EN)", name: "desc_en", widget: "text"}
              - {label: "شارة الحالة (عربي، مثال: سارية)", name: "status_ar", widget: "string", required: false, default: ""}
              - {label: "Status badge (EN, e.g. Active)", name: "status_en", widget: "string", required: false, default: ""}
              - {label: "رقم الرخصة/الاعتماد (اختياري)", name: "credential_number", widget: "string", required: false, default: ""}
              - {label: "الصلاحية أو الفترة (عربي)", name: "period_ar", widget: "string", required: false, default: ""}
              - {label: "Validity or period (EN)", name: "period_en", widget: "string", required: false, default: ""}
              - label: "إحصاءات بارزة (عربي، اختياري)"
                name: "stats_ar"
                widget: "list"
                required: false
                field: {label: "نص (يدعم <b> للتمييز)", name: "item", widget: "string"}
              - label: "Highlighted stats (EN, optional)"
                name: "stats_en"
                widget: "list"
                required: false
                field: {label: "Text (supports <b> for emphasis)", name: "item", widget: "string"}
              - {label: "صورة/شعار (اختياري)", name: "image", widget: "image", required: false, default: "", media_folder: "/assets/images/licenses", public_folder: "/assets/images/licenses"}
              - {label: "رابط التحقق (اختياري)", name: "verify_url", widget: "string", required: false, default: ""}

  - name: "badges"
    label: "الشارات الرقمية"
    files:
      - name: "badges"
        label: "قائمة الشارات"
        file: "data/badges.json"
        fields:
          - label: "الشارات"
            name: "badges"
            widget: "list"
            summary: "{{title_ar}}"
            fields:
              - {label: "معرّف داخلي", name: "id", widget: "hidden", default: ""}
              - {label: "العنوان (عربي)", name: "title_ar", widget: "string"}
              - {label: "العنوان (Title EN)", name: "title_en", widget: "string"}
              - {label: "الجهة المانحة (عربي)", name: "org_ar", widget: "string"}
              - {label: "الجهة المانحة (Issuer EN)", name: "org_en", widget: "string"}
              - label: "أبرز المهارات (عربي)"
                name: "skills_ar"
                widget: "list"
                required: false
                field: {label: "مهارة", name: "item", widget: "string"}
              - label: "Key skills (EN)"
                name: "skills_en"
                widget: "list"
                required: false
                field: {label: "Skill", name: "item", widget: "string"}
              - {label: "صورة الشارة", name: "image", widget: "image", required: false, default: "", media_folder: "/assets/badges", public_folder: "/assets/badges"}
              - {label: "رابط التحقق/التوثيق", name: "verify_url", widget: "string", required: false, default: "", hint: "رابط صفحة التحقق من الشارة — تصبح البطاقة كاملة قابلة للنقر إليه"}
